<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Digital Forensics Analyzer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 90vh; background: #f8fafc; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <div class="card" style="max-width: 440px; width: 90%; margin: 2rem auto; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-radius: 8px;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; background: #ebf8ff; color: var(--accent); margin-bottom: 0.75rem;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2 style="font-size: 1.35rem; color: #2d3748; margin-bottom: 0.25rem;">Admin Authentication</h2>
      <p style="font-size: 0.85rem; color: #718096;">Storage Management &amp; Retention Console</p>
    </div>

    {% if error %}
    <div class="alert alert-danger" style="margin-bottom: 1rem; padding: 0.6rem 0.8rem; font-size: 0.85rem;">
      {{ error }}
    </div>
    {% endif %}

    <form action="/admin/login" method="POST">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label" for="password">Administrator Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter admin password" required autofocus>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.65rem;">
        Log In to Admin Console
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem;">
      <a href="/" style="color: var(--accent); text-decoration: none;">&larr; Return to Evidence Intake</a>
    </div>
  </div>
</body>
</html>
