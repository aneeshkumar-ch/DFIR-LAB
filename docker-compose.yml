services:
  dfir-analyzer:
    build: .
    container_name: dfir-analyzer
    restart: unless-stopped
    ports:
      - "888:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - AUTOPSY_ENABLED=false
      # Option A: Automated Storage Optimization & Retention Policies
      - AUTO_CLEAN_WORKING_IMAGE=true
      - RAW_IMAGE_RETENTION_HOURS=24
      - JOB_RETENTION_HOURS=72
      - CLEANUP_INTERVAL_SECONDS=1800
      - MIN_FREE_DISK_GB=1.5
    volumes:
      - ./jobs:/app/jobs

